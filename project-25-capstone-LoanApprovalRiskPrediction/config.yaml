project:
  name: "loan-approval-risk-prediction"
  random_state: 42

data:
  raw_path: "data/loan_applications.csv"
  n_samples: 6000
  test_size: 0.20
  target_column: "loan_approved"

  # Synthetic generator settings (used only if raw_path doesn't exist yet)
  synthetic:
    default_rate_base: 0.12        # base probability an applicant defaults / gets rejected
    seed: 42

columns:
  numeric:
    - applicant_income
    - coapplicant_income
    - loan_amount
    - loan_term_months
    - employment_years
    - age
    - dependents
    - previous_defaults
    - existing_loans_count
    - credit_score
  categorical:
    - education
    - self_employed
    - property_area
    - marital_status
  engineered:
    - income_to_loan_ratio
    - total_income
    - debt_to_income
    - employment_stability
    - credit_utilization_risk

preprocessing:
  numeric_imputer_strategy: "median"
  categorical_imputer_strategy: "most_frequent"
  scale_numeric: true

training:
  cv_folds: 5
  scoring: "roc_auc"
  n_iter_search: 15          # RandomizedSearchCV iterations per model

models:
  logistic_regression:
    enabled: true
    param_grid:
      C: [0.01, 0.1, 1, 10]
      penalty: ["l2"]
      class_weight: ["balanced"]

  random_forest:
    enabled: true
    param_grid:
      n_estimators: [200, 400, 600]
      max_depth: [4, 6, 8, 12]
      min_samples_leaf: [1, 3, 5]
      class_weight: ["balanced"]

  xgboost:
    enabled: true
    param_grid:
      n_estimators: [200, 400, 600]
      max_depth: [3, 4, 5, 6]
      learning_rate: [0.01, 0.05, 0.1]
      subsample: [0.7, 0.85, 1.0]

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "loan-approval-risk"

paths:
  artifacts_dir: "artifacts/"
  best_pipeline: "artifacts/model_pipeline.joblib"
  metrics: "artifacts/metrics.json"
  feature_importance: "artifacts/feature_importance.csv"
  reports_dir: "reports/"
  figures_dir: "reports/figures/"
