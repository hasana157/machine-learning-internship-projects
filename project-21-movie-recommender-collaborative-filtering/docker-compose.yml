version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cinematch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinematch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinematch_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-cinematch_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinematch_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinematch-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: cinematch-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-cinematch_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinematch-network

  # PgAdmin (PostgreSQL UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cinematch-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cinematch.ai}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinematch-network

  # Redis Commander (Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cinematch-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-cinematch_redis_password}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - cinematch-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinematch-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinematch_user}:${POSTGRES_PASSWORD:-cinematch_secure_password}@postgres:5432/${POSTGRES_DB:-cinematch_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinematch_redis_password}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - cinematch-network
    restart: unless-stopped

  # ML Service with Gradio
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: cinematch-ml
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinematch_user}:${POSTGRES_PASSWORD:-cinematch_secure_password}@postgres:5432/${POSTGRES_DB:-cinematch_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cinematch_redis_password}@redis:6379/1
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "7860:7860"
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml:/app
      - ml_models:/app/models
      - ml_data:/app/data
    networks:
      - cinematch-network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinematch-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GRADIO_URL: ${NEXT_PUBLIC_GRADIO_URL:-http://localhost:7860}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - cinematch-network
    restart: unless-stopped

  # MLflow Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: cinematch-mlflow
    working_dir: /app
    command: >
      bash -c "pip install mlflow -q && 
               mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app
    networks:
      - cinematch-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: cinematch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - cinematch-network
    restart: unless-stopped

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: cinematch-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - cinematch-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_models:
    driver: local
  ml_data:
    driver: local
  mlflow_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cinematch-network:
    driver: bridge
