version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: leadforge-postgres
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: leadforge_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadforge-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: leadforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leadforge-network

  # Backend API (Litestar)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leadforge-backend
    environment:
      DATABASE_URL: postgresql://leadforge:password@postgres:5432/leadforge_db
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./models:/app/models
    networks:
      - leadforge-network
    restart: unless-stopped

  # Plotly Dash Analytics Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: leadforge-dashboard
    environment:
      DATABASE_URL: postgresql://leadforge:password@postgres:5432/leadforge_db
    ports:
      - "8050:8050"
    depends_on:
      - postgres
    volumes:
      - ./dashboard:/app
      - ./models:/app/models
    networks:
      - leadforge-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  leadforge-network:
    driver: bridge
